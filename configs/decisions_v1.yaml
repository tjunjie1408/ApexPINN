# O2: heat-load proxy formula and normalization. Default candidate; T6 compares candidates on
# training-fold races only and records the choice.
o2_heat_load_proxy:
  formula: energy_index # mean(|a_lat| + |a_lon|) from position and speed
  candidates: [speed_trap, energy_index, brake_fraction_weighted]
  normalization: per_fold_minmax # statistics fitted on each fold's training circuits only

# O3: race-lap trend phi (s per race lap, fuel burn-off plus track evolution) and traffic threshold.
# Default: phi_mid near the literature fuel effect (about 0.03 s/kg at about 1.8 kg/lap); low and high
# bracket it for the sensitivity sweep. Must satisfy phi_low <= phi_mid <= phi_high.
o3_race_lap_trend:
  phi_low: 0.03
  phi_mid: 0.06
  phi_high: 0.09
  traffic_gap_threshold_s: 1.0

# O4: target definition (PROJECT section 4.2): y = lap_time_s - phi * (L_race - race_lap).
o4_target:
  definition: race_lap_trend_corrected

# O5: forecasting protocol (PROJECT section 4.5). Chosen before any model results are seen.
o5_protocol:
  horizons: [1, 3, 5, 10]
  primary_horizon: 5
  k_min: 3

# O6: synthetic study (S1b) ranges, noise, identifiable subset, and pass tolerance (relative error).
o6_synthetic:
  n_seeds: 5
  noise_levels_s: [0.05, 0.15]
  identifiable_subset: [rho_c, k_c]
  tolerance:
    rho_c: 0.15
    k_c: 0.25

# O7: ensemble size and tuning budget. The budget is equal for all models.
o7_ensemble:
  ensemble_size: 5
  tuning_budget:
    kind: trials
    per_model: 20

# O8: pit-loss estimation and strategy candidate set.
o8_strategy:
  pit_loss: per_circuit_median_iqr
  max_stops: 2
  candidate_window_laps: 10 # candidates within +-10 laps of the actual stops
