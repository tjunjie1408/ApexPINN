# ApexPINN frozen decisions O1-O8 (PRD section 9).
#
# status: draft means the structure is final but the values are documented defaults.
# T6 (data probe) replaces the defaults with probe-backed values and sets status: frozen.
# Loaded and validated by apexpinn.contracts.load_decisions.

version: 1
status: draft

# O1: race list and circuit-to-fold map (leave-one-circuit-group-out).
# Default: every 2023-2024 calendar event and K = 6 folds of 4 circuits. T6 drops wet races and
# races with more than 20% missing telemetry. Every circuit belongs to exactly one fold, across all seasons.
# Event ids are "<season>_<circuit>".
# O1 design approved 2026-11-02; event eligibility checks remain open. See DECISIONS_REVIEW.md.
# Wet rule (user decision 2026-11-03): a race is wet only if any lap ran on INTERMEDIATE or WET tyres.
# A Rainfall weather flag alone does not exclude a race; 2024_spielberg (0 wet-compound laps) restored.
o1_races:
  dev_seasons: [2023, 2024]
  folds:
    F1: [bahrain, jeddah, melbourne, suzuka]
    F2: [shanghai, miami, imola, monaco]
    F3: [barcelona, montreal, spielberg, silverstone]
    F4: [budapest, spa, zandvoort, monza]
    F5: [baku, singapore, austin, mexico_city]
    F6: [interlagos, las_vegas, lusail, yas_marina]
  dev_events:
